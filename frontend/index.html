<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F6F3FB">
  <title>KnowFlow</title>
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <aside class="sidebar" aria-label="Main">
    <a class="side-brand" href="#/dashboard"><img class="logo-img" src="logo.png" alt="">KnowFlow</a>
    <a class="side-cta" href="#/record"><span class="ti" data-icon="plus"></span>Log a shift</a>
    <nav class="side-nav">
      <a href="#/dashboard" data-side="dashboard"><span class="ti" data-icon="layout-dashboard"></span>Dashboard</a>
      <a href="#/record" data-side="record"><span class="ti" data-icon="mic"></span>Record</a>
      <a href="#/ask" data-side="ask"><span class="ti" data-icon="search"></span>Ask</a>
      <a href="#/practice" data-side="practice"><span class="ti" data-icon="gamepad"></span>Practice</a>
      <a href="#/wallet" data-side="wallet"><span class="ti" data-icon="wallet"></span>Wallet</a>
    </nav>
    <div class="side-card"><img class="logo-img" src="logo.png" alt=""><b>Knowledge that doesn't retire</b><small>Experts' fixes, approved and kept.</small></div>
  </aside>

  <header class="topbar">
    <a class="brand" href="#/record" aria-label="KnowFlow home">
      <img class="logo-img" src="logo.png" alt="KnowFlow logo">
      <span class="brand-text"><b>KnowFlow</b><small>Knowledge that doesn't retire</small></span>
    </a>
    <form class="top-search" id="topSearch" role="search">
      <span class="ti" data-icon="search"></span>
      <input type="search" id="topQ" placeholder="Ask KnowFlow..." aria-label="Ask KnowFlow" autocomplete="off">
    </form>
    <button class="who" id="who" type="button" aria-label="Change user"></button>
  </header>

  <main id="view" tabindex="-1"></main>

  <nav class="tabs" id="tabs" aria-label="Main">
    <a href="#/record" data-tab="record"><span class="ti" data-icon="mic"></span>Record</a>
    <a href="#/ask" data-tab="ask"><span class="ti" data-icon="search"></span>Ask</a>
    <a href="#/practice" data-tab="practice"><span class="ti" data-icon="gamepad"></span>Practice</a>
    <a href="#/dashboard" data-tab="dashboard"><span class="ti" data-icon="layout-dashboard"></span>Dashboard</a>
    <a href="#/wallet" data-tab="wallet"><span class="ti" data-icon="wallet"></span>Wallet</a>
  </nav>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <dialog id="modal"></dialog>

  <script src="icons.js"></script>
  <script src="app.js"></script>
</body>
</html>
